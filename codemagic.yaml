workflows:
  build-cryptosafe-release:
    name: Build CryptoSafe Release APK
    # Critical: must be exactly "linux" (case-sensitive!)
    instance_type: linux
    max_build_duration: 20
    
    environment:
      java: 17
      groups:
        - credentials 
      vars:
        KEYSTORE_PATH: "app/release.keystore"

    scripts:
      - name: Create Temporary Keystore
        script: |
          keytool -genkey -v \
            -keystore $KEYSTORE_PATH \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CryptoSafe, OU=Dev, O=CryptoSafe, L=City, S=State, C=US"

      - name: Build release APK
        script: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - your.nemoxdev@proton.me
        notify:
          success: true
          failure: true
          
