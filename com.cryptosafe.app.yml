Categories:
  - Security
License: MIT
AuthorName: Nemo
AuthorEmail: your.nemoxdev@proton.me
SourceCode: https://github.com/nemoXdev/CryptoSafe
IssueTracker: https://github.com/nemoXdev/CryptoSafe/issues
Changelog: https://github.com/nemoXdev/CryptoSafe/releases

AutoName: CryptoSafe
Description: |-
  CryptoSafe is a lightweight, offline-first Android app for military-grade text
  encryption. Your data never leaves your device.

  Features:
  * Strong Encryption: AES-256-GCM with Argon2id key derivation (128 MiB, 4 iterations)
  * 100% Offline: No internet permission needed
  * Screenshot Blocked: FLAG_SECURE prevents accidental leaks
  * Zero Storage: No logs, no cache, no database
  * Modern UI: Material 3 design with dark theme
  

RepoType: git
Repo: https://github.com/nemoXdev/CryptoSafe.git

Builds:
  - versionName: "1.2.0"
    versionCode: 4
    commit: v1.2.0
    subdir: app
    gradle:
      - release
    gradleprops:
      - CRYPTOSAFE_STORE_PASSWORD=
      - CRYPTOSAFE_KEY_PASSWORD=
    scandelete:
      - app/release.keystore
    output: app/build/outputs/apk/release/app-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: build.gradle.kts|versionCode = (\d+)|.|versionName = "([^"]+)"
CurrentVersion: "1.2.0"
CurrentVersionCode: 4
