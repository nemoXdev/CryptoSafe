    subdir: app
    gradle:
      - release
    gradleprops:
      - CRYPTOSAFE_STORE_PASSWORD=
      - CRYPTOSAFE_KEY_PASSWORD=
    output: app/build/outputs/apk/release/app-release.apk
    

AutoUpdateMode: Version
